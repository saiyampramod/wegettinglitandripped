name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/ppl-workout-split-acnlq6
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        env:
          # Firebase web config — not secret (it ships in every client bundle
          # by design), so it's fine to keep in plain text here.
          VITE_FIREBASE_API_KEY: AIzaSyBWjhSN_xJXZH3LxqfQtK_YxAdzO9jd_ng
          VITE_FIREBASE_AUTH_DOMAIN: musclemommy-9e441.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: musclemommy-9e441
          VITE_FIREBASE_STORAGE_BUCKET: musclemommy-9e441.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1030833765272"
          VITE_FIREBASE_APP_ID: "1:1030833765272:web:5aa8048d003530985c09ed"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: musclemommy-9e441
